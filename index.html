<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شعار التدريبات العسكرية</title>
    <style>
        /* إعدادات الصفحة والخلفية لتكون مطابقة للموقع */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* تدرج لوني كحلي ملكي عميق */
            background: radial-gradient(circle, #0d0d5c 0%, #050524 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        /* الحاوية الرئيسية للشعار */
        .logo-wrapper {
            position: relative;
            width: 350px;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.4s ease;
        }

        .logo-wrapper:hover {
            transform: scale(1.05); /* تأثير تكبير بسيط عند المرور بالماوس */
        }

        /* الدائرة الكحلية الكبيرة */
        .main-circle {
            width: 300px;
            height: 300px;
            background-color: #0b0b4b;
            border-radius: 50%;
            border: 10px double #c5a04d; /* الإطار الذهبي المزدوج */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.7);
        }

        /* النص المنحني بالأعلى */
        .curved-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 15px;
        }

        .curved-text svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .curved-text text {
            fill: #ffffff;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* السيوف المتقاطعة الذهبية */
        .swords {
            position: absolute;
            width: 240px;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sword {
            position: absolute;
            width: 250px;
            height: 8px;
            background-color: #c5a04d;
            border-radius: 4px;
        }

        .sword::before {
            content: '';
            position: absolute;
            width: 12px;
            height: 40px;
            background-color: #c5a04d;
            left: 25px;
            top: -16px;
            border-radius: 2px;
        }

        .s1 { transform: rotate(45deg); }
        .s2 { transform: rotate(-45deg); }

        /* الدائرة الصغيرة في المنتصف والحرف R */
        .center-dot {
            position: relative;
            width: 85px;
            height: 85px;
            background-color: #0b0b4b;
            border: 4px solid #c5a04d;
            border-radius: 50%;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 45px;
            font-weight: bold;
            font-family: 'serif';
        }

        /* غصن الزيتون/الإكليل السفلي */
        .wreath {
            position: absolute;
            bottom: 35px;
            width: 160px;
            height: 50px;
            border-bottom: 6px solid #c5a04d;
            border-radius: 50%;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="logo-wrapper">
        <div class="main-circle">
            
            <div class="curved-text">
                <svg viewBox="0 0 500 500">
                    <path id="textPath" d="M 100,250 A 150,150 0 1,1 400,250" fill="transparent" />
                    <text>
                        <textPath xlink:href="#textPath" startOffset="50%" text-anchor="middle">
                            التدريبات العسكرية
                        </textPath>
                    </text>
                </svg>
            </div>

            <div class="swords">
                <div class="sword s1"></div>
                <div class="sword s2"></div>
            </div>

            <div class="center-dot">R</div>

            <div class="wreath"></div>

        </div>
    </div>

</body>
</html>
