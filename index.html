<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة التدريبات العسكرية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="logo-section">
            <div class="military-logo">
                <div class="curved-text">
                    <svg viewBox="0 0 500 500">
                        <path id="curve" d="M 100,250 A 150,150 0 1,1 400,250" fill="transparent" />
                        <text>
                            <textPath xlink:href="#curve" startOffset="50%" text-anchor="middle">
                                التدريبات العسكرية
                            </textPath>
                        </text>
                    </svg>
                </div>
                <div class="swords">
                    <div class="sword s1"></div>
                    <div class="sword s2"></div>
                </div>
                <div class="inner-circle">R</div>
            </div>
        </div>

        <div class="content-section">
            <h1>نظام التدريبات العسكرية</h1>
            <p>مرحباً بك في المنصة الخاصة بالتدريبات العسكرية التقنية</p>
            <div class="buttons">
                <button class="btn-gold">تسجيل الدخول</button>
                <button class="btn-outline">المزيد من المعلومات</button>
            </div>
        </div>
    </div>

</body>
</html>
